<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>خطة 1600 كالوري</title>
  <style>
    body{font-family:system-ui,Arial; padding:16px; background:#fafafa}
    .wrap{max-width:1100px;margin:0 auto}
    h1{margin:0 0 12px}
    a{color:#111}
    table{width:100%; border-collapse:collapse; background:#fff}
    th,td{border:1px solid #ddd; padding:10px; vertical-align:top; white-space:pre-wrap}
    th{background:#f2f2f2}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .btn{display:inline-block;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px 10px;text-decoration:none}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>خطة 1600 كالوري</h1>
    <div>
      <a class="btn" href="../">⬅ رجوع للاختيار</a>
      <a class="btn" href="./meal_plan.csv" download>تحميل CSV</a>
    </div>
  </div>

  <table id="t">
    <thead>
      <tr>
        <th>اليوم</th><th>الإفطار</th><th>الغداء</th><th>العشاء</th><th>وجبة خفيفة</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const rows = [];
  const splitLine = (line) => {
    const out = [];
    let cur = "", q = false;
    for (let i=0;i<line.length;i++){
      const c = line[i];
      if (c === '"') q = !q;
      else if (c === ',' && !q){ out.push(cur); cur=""; }
      else cur += c;
    }
    out.push(cur);
    return out.map(s => s.replace(/^"|"$/g,'').trim());
  };

  const header = splitLine(lines[0]).map(h=>h.toLowerCase());
  for (let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols = splitLine(lines[i]);
    const obj = {};
    header.forEach((h,idx)=> obj[h] = cols[idx] ?? "");
    rows.push(obj);
  }
  return rows;
}

fetch("./meal_plan.csv")
  .then(r => r.text())
  .then(text => {
    const rows = parseCSV(text);
    const tbody = document.querySelector("#t tbody");
    tbody.innerHTML = "";
    rows.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.day ?? ""}</td>
        <td>${r.breakfast ?? ""}</td>
        <td>${r.lunch ?? ""}</td>
        <td>${r.dinner ?? ""}</td>
        <td>${r.snack ?? ""}</td>
      `;
      tbody.appendChild(tr);
    });
  })
  .catch(err => {
    document.querySelector("#t tbody").innerHTML =
      `<tr><td colspan="5">تعذر تحميل الملف: ${err}</td></tr>`;
  });
</script>
</body>
</html>
